name = "kielet_gen"
version = "1.0.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
description = "Code parser and generator for kielet"
licences = ["MIT"]
repository = { type = "sourcehut", user = "tpjg", repo = "kielet-gen" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

internal_modules = ["kielet_gen"]

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
kielet = ">= 3.0.0 and < 4.0.0"
simplifile = ">= 2.3.0 and < 3.0.0"
gleam_regexp = ">= 1.1.1 and < 2.0.0"
glance = ">= 5.0.1 and < 6.0.0"
glint = ">= 1.2.1 and < 2.0.0"
argv = ">= 1.0.2 and < 2.0.0"
snag = ">= 1.1.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
